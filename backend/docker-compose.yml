services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugshaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugshaper}
      POSTGRES_DB: bugshaper
    volumes:
      - bugshaper-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugshaper -d bugshaper"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      additional_contexts:
        website: ../website
    image: bugshaper-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BUGSHAPER_PUBLISH_PORT:-4318}:4318"
    env_file:
      - ${BUGSHAPER_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      BUGSHAPER_HOST: "0.0.0.0"
      BUGSHAPER_PORT: "4318"
      DATABASE_URL: postgres://bugshaper:${POSTGRES_PASSWORD:-bugshaper}@postgres:5432/bugshaper
      BUGSHAPER_MEDIA_DIR: /data/media
      BUGSHAPER_TRUST_PROXY: "1"
    volumes:
      - bugshaper-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bugshaper-data:
  bugshaper-pg:
